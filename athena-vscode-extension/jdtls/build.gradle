plugins {
    id 'java'
}

version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def redHatJavaServerDir = file(System.getenv('REDHAT_JAVA_SERVER_DIR')
        ?: "${System.properties['user.home']}/.vscode/extensions/redhat.java-1.53.0-linux-x64/server/plugins")

def requiredBundle = { String glob ->
    def matches = fileTree(redHatJavaServerDir).matching { include glob }.files.sort()
    if (matches.isEmpty()) {
        throw new GradleException("Missing required Red Hat Java server bundle '${glob}' under ${redHatJavaServerDir}")
    }
    matches.first()
}

dependencies {
    compileOnly files(
            requiredBundle('org.eclipse.jdt.core_*.jar'),
            requiredBundle('org.eclipse.jdt.core.compiler.batch_*.jar'),
            requiredBundle('org.eclipse.core.resources_*.jar'),
            requiredBundle('org.eclipse.core.runtime_*.jar'),
            requiredBundle('org.eclipse.core.jobs_*.jar'),
            requiredBundle('org.eclipse.equinox.registry_*.jar'),
            requiredBundle('org.eclipse.equinox.common_*.jar'),
            requiredBundle('org.eclipse.osgi_*.jar')
    )
}

jar {
    archiveBaseName = 'ca.frc6390.athena.jdtls'
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Athena JDT Language Server Support',
                'Bundle-SymbolicName': 'ca.frc6390.athena.jdtls;singleton:=true',
                'Bundle-Version': project.version,
                'Bundle-Vendor': 'FRC 6390',
                'Bundle-ActivationPolicy': 'lazy',
                'Bundle-ClassPath': '.',
                'Bundle-Activator': 'ca.frc6390.athena.jdtls.AthenaJdtlsActivator',
                'Bundle-RequiredExecutionEnvironment': 'JavaSE-17',
                'Require-Bundle': 'org.eclipse.core.runtime,org.eclipse.core.resources,org.eclipse.core.jobs,org.eclipse.equinox.registry,org.eclipse.jdt.core',
                'Automatic-Module-Name': 'ca.frc6390.athena.jdtls'
        )
    }
}

tasks.register('syncBundle', Copy) {
    dependsOn tasks.named('jar')
    from(tasks.named('jar'))
    into(rootProject.file('athena-vscode-extension/server'))
}
