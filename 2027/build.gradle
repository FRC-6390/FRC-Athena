tasks.register('verifyExampleDocs') {
    description = 'Checks that the example catalog references every example source file.'
    group = 'verification'

    def catalog = layout.projectDirectory.file('docs/examples.md')
    def examplesDir = layout.projectDirectory.dir('example-project/src/main/java/ca/frc6390/athena/examples')

    inputs.file(catalog)
    inputs.dir(examplesDir)

    doLast {
        def catalogText = catalog.asFile.text
        def missing = fileTree(examplesDir).matching { include '**/*.java' }.files
                .collect { it.name }
                .findAll { !catalogText.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Example catalog is missing entries for: ${missing.join(', ')}")
        }
    }
}

tasks.register('verifyMigrationMatrix') {
    description = 'Checks that remaining migration roadmap rows are tracked in the migration matrix.'
    group = 'verification'

    def roadmap = layout.projectDirectory.file('docs/coverage-roadmap.md')
    def matrix = layout.projectDirectory.file('docs/migration-matrix.md')

    inputs.file(roadmap)
    inputs.file(matrix)

    doLast {
        def roadmapText = roadmap.asFile.text
        def matrixText = matrix.asFile.text
        def remainingSection = roadmapText.split('## Remaining Major Migrations', 2)
        if (remainingSection.length != 2) {
            throw new GradleException('Coverage roadmap must contain Remaining Major Migrations section.')
        }
        def missing = []
        remainingSection[1].readLines()
                .findAll { it.startsWith('|') && !it.contains('---') && !it.contains('Area | Target Module') }
                .each { row ->
                    def cells = row.split('\\|').collect { it.trim() }.findAll { !it.isBlank() }
                    if (!cells.isEmpty()) {
                        def area = cells[0]
                        if (!matrixText.contains(area)) {
                            missing.add(area)
                        }
                    }
                }
        if (!missing.isEmpty()) {
            throw new GradleException("Migration matrix is missing remaining roadmap areas: ${missing.join(', ')}")
        }
        ['Implemented', 'Boundary', 'Deferred'].each { status ->
            if (!matrixText.contains("- `${status}`:")) {
                throw new GradleException("Migration matrix must document the ${status} status.")
            }
        }
        if (!matrixText.contains('| Implemented |')) {
            throw new GradleException('Migration matrix must include implemented evidence rows.')
        }
    }
}

tasks.register('verifyV3DirectionBacklog') {
    description = 'Checks that the accepted V3 direction scope stays synced with the 2027 roadmap.'
    group = 'verification'

    def v3Direction = layout.projectDirectory.file('docs/api-v3-direction.md')
    def roadmap = layout.projectDirectory.file('docs/coverage-roadmap.md')

    inputs.file(v3Direction)
    inputs.file(roadmap)

    doLast {
        def collectTableAreas = { String text, String sectionName ->
            def section = text.split("## ${sectionName}", 2)
            if (section.length != 2) {
                throw new GradleException("Document must contain ${sectionName} section.")
            }
            section[1].split('\\n## ', 2)[0]
                    .readLines()
                    .findAll { it.startsWith('|') && !it.contains('---') && !it.contains('Area |') }
                    .collect { row ->
                        row.split('\\|').collect { it.trim() }.findAll { !it.isBlank() }[0]
                    }
                    .findAll { !it.isBlank() }
                    .toSet()
        }

        def directionText = v3Direction.asFile.text
        def roadmapAreas = collectTableAreas(roadmap.asFile.text, 'Remaining Major Migrations')
        roadmapAreas.each { area ->
            if (!directionText.contains(area)) {
                throw new GradleException("V3 direction scope must mention remaining roadmap area: ${area}.")
            }
        }
        ['Phoenix 5 motor controllers', 'Dashboard layout/UI schema', 'Annotation/state DSL'].each { decision ->
            if (!directionText.contains(decision)) {
                throw new GradleException("V3 direction scope must document decision: ${decision}.")
            }
        }
    }
}

