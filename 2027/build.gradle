tasks.register('generateVendordep') {
    description = 'Generates the single Athena 2027 vendordep from Gradle properties.'
    group = 'publishing'

    def outputFile = layout.projectDirectory.file('vendordeps/FRC6390-Athena.json')
    outputs.file(outputFile)

    doLast {
        def dependencies = rootProject.ext.athenaDefaultArtifacts.collect { artifact ->
            [
                    groupId   : rootProject.findProperty('athenaGroup'),
                    artifactId: artifact,
                    version   : rootProject.findProperty('athenaVersion')
            ]
        }
        def vendordep = [
                fileName        : 'FRC6390-Athena.json',
                name            : 'FRC6390 Athena',
                version         : rootProject.findProperty('athenaVersion'),
                frcYear         : rootProject.findProperty('athenaFrcYear'),
                uuid            : rootProject.findProperty('athenaUuid'),
                mavenUrls       : [rootProject.findProperty('athenaMavenUrl')],
                jsonUrl         : rootProject.findProperty('athenaJsonUrl'),
                javaDependencies: dependencies,
                jniDependencies : [],
                cppDependencies : []
        ]
        outputFile.asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(vendordep)) + '\n'
    }
}

tasks.register('verifyVendordep') {
    description = 'Checks that the checked-in vendordep matches generated metadata.'
    group = 'verification'
    dependsOn 'generateVendordep'

    doLast {
        def vendordep = new groovy.json.JsonSlurper().parse(layout.projectDirectory.file('vendordeps/FRC6390-Athena.json').asFile)
        def expectedArtifacts = rootProject.ext.athenaDefaultArtifacts as Set
        def actualArtifacts = vendordep.javaDependencies.collect { it.artifactId } as Set
        if (actualArtifacts != expectedArtifacts) {
            throw new GradleException("Vendordep default artifacts mismatch. Expected ${expectedArtifacts}, found ${actualArtifacts}.")
        }
        if (vendordep.version != rootProject.findProperty('athenaVersion')) {
            throw new GradleException("Vendordep version ${vendordep.version} does not match athenaVersion.")
        }
        if (vendordep.frcYear.toString() != rootProject.findProperty('athenaFrcYear').toString()) {
            throw new GradleException("Vendordep frcYear ${vendordep.frcYear} does not match athenaFrcYear.")
        }
        if (!vendordep.jniDependencies.isEmpty() || !vendordep.cppDependencies.isEmpty()) {
            throw new GradleException('Athena 2027 vendordep should not publish JNI or C++ dependencies yet.')
        }
    }
}

tasks.register('verifyReleaseMetadata') {
    description = 'Validates version, UUID, artifact, and publication metadata for a release.'
    group = 'verification'
    dependsOn 'verifyVendordep'

    doLast {
        def version = rootProject.findProperty('athenaVersion')?.toString()
        if (!(version ==~ /2027\.\d+\.\d+(-[A-Za-z0-9.-]+)?/)) {
            throw new GradleException("athenaVersion must look like 2027.x.y or 2027.x.y-SNAPSHOT, found ${version}.")
        }
        try {
            java.util.UUID.fromString(rootProject.findProperty('athenaUuid')?.toString())
        } catch (IllegalArgumentException ex) {
            throw new GradleException('athenaUuid must be a valid UUID.', ex)
        }
        def defaultArtifacts = rootProject.ext.athenaDefaultArtifacts as Set
        def projectArtifacts = subprojects.collect { it.name } as Set
        def missingProjects = defaultArtifacts.findAll { !projectArtifacts.contains(it) }
        if (!missingProjects.isEmpty()) {
            throw new GradleException("Default vendordep artifacts missing matching projects: ${missingProjects}.")
        }
        def optionalArtifacts = [
                'athena-drivetrain',
                'athena-superstructure',
                'athena-simulation',
                'athena-vision',
                'athena-localization',
                'athena-auto',
                'athena-dashboard',
                'athena-vendor-ctre',
                'athena-vendor-rev',
                'athena-vendor-studica',
                'athena-vendor-photonvision',
                'athena-vendor-limelight',
                'athena-vendor-pathplanner',
                'athena-vendor-choreo',
                'athena-wpilib'
        ] as Set
        def leakedOptionalArtifacts = defaultArtifacts.intersect(optionalArtifacts)
        if (!leakedOptionalArtifacts.isEmpty()) {
            throw new GradleException("Optional artifacts should not be in the default vendordep: ${leakedOptionalArtifacts}.")
        }
        subprojects.findAll { rootProject.ext.athenaPublishedArtifacts.contains(it.name) }.each { project ->
            def publication = project.publishing.publications.findByName('mavenJava')
            if (publication == null) {
                throw new GradleException("${project.path} is missing mavenJava publication.")
            }
        }
    }
}

tasks.register('verifyVendorMetadata') {
    description = 'Validates Athena vendor metadata resources used by the Gradle plugin.'
    group = 'verification'

    doLast {
        def metadataFiles = fileTree('athena-plugin/src/main/resources/META-INF/athena/vendors') {
            include '*.json'
        }.files.sort { it.name }
        if (metadataFiles.isEmpty()) {
            throw new GradleException('Athena plugin must ship at least one vendor metadata resource.')
        }

        def features = [] as Set
        def projectArtifacts = subprojects.collect { it.name } as Set
        def metadataArtifacts = [] as Set
        metadataFiles.each { file ->
            def metadata = new groovy.json.JsonSlurper().parse(file)
            if (!(metadata.feature instanceof String) || metadata.feature.isBlank()) {
                throw new GradleException("${file.name} must declare nonblank feature.")
            }
            if (!features.add(metadata.feature)) {
                throw new GradleException("Duplicate vendor feature metadata for ${metadata.feature}.")
            }
            if (!(metadata.detect instanceof Map)) {
                throw new GradleException("${file.name} must declare detect object.")
            }
            ['vendordepUuids', 'dependencies'].each { field ->
                if (!(metadata.detect[field] instanceof List)) {
                    throw new GradleException("${file.name} detect.${field} must be a list.")
                }
                if (!metadata.detect[field].every { it instanceof String && !it.isBlank() }) {
                    throw new GradleException("${file.name} detect.${field} must contain only nonblank strings.")
                }
            }
            if (!(metadata.artifacts instanceof List) || metadata.artifacts.isEmpty()) {
                throw new GradleException("${file.name} must declare at least one artifact.")
            }
            metadata.artifacts.each { artifact ->
                if (!(artifact instanceof String) || artifact.isBlank()) {
                    throw new GradleException("${file.name} artifacts must contain only nonblank strings.")
                }
                if (artifact.split(':').length != 2) {
                    throw new GradleException("${file.name} artifact ${artifact} must be group:artifact without a version.")
                }
                def artifactId = artifact.split(':')[1]
                metadataArtifacts.add(artifactId)
                if (!projectArtifacts.contains(artifactId)) {
                    throw new GradleException("${file.name} references missing project artifact ${artifactId}.")
                }
            }
        }

        def vendorProjects = projectArtifacts.findAll { it.startsWith('athena-vendor-') } as Set
        def missingMetadata = vendorProjects - metadataArtifacts
        if (!missingMetadata.isEmpty()) {
            throw new GradleException("Vendor projects missing plugin metadata resources: ${missingMetadata}.")
        }
    }
}

tasks.register('verifyVendorServiceDescriptors') {
    description = 'Validates ServiceLoader descriptors in vendor adapter modules.'
    group = 'verification'

    doLast {
        def expectedDescriptors = [
                'athena-vendor-ctre'   : [
                        'ca.frc6390.athena.hardware.backend.MotorBackend':
                                ['ca.frc6390.athena.vendor.ctre.CtreMotorBackend'],
                        'ca.frc6390.athena.hardware.backend.EncoderBackend':
                                ['ca.frc6390.athena.vendor.ctre.CtreEncoderBackend'],
                        'ca.frc6390.athena.hardware.backend.ImuBackend':
                                ['ca.frc6390.athena.vendor.ctre.CtreImuBackend']
                ],
                'athena-vendor-rev'    : [
                        'ca.frc6390.athena.hardware.backend.MotorBackend':
                                ['ca.frc6390.athena.vendor.rev.RevMotorBackend'],
                        'ca.frc6390.athena.hardware.backend.EncoderBackend':
                                ['ca.frc6390.athena.vendor.rev.RevEncoderBackend']
                ],
                'athena-vendor-studica': [
                        'ca.frc6390.athena.hardware.backend.ImuBackend':
                                ['ca.frc6390.athena.vendor.studica.StudicaImuBackend']
                ]
        ]

        expectedDescriptors.each { moduleName, descriptors ->
            descriptors.each { serviceName, implementations ->
                def descriptor = layout.projectDirectory.file("${moduleName}/src/main/resources/META-INF/services/${serviceName}").asFile
                if (!descriptor.isFile()) {
                    throw new GradleException("${moduleName} is missing ServiceLoader descriptor ${serviceName}.")
                }
                def actual = descriptor.readLines()
                        .collect { it.trim() }
                        .findAll { !it.isBlank() && !it.startsWith('#') }
                if (actual != implementations) {
                    throw new GradleException("${moduleName} descriptor ${serviceName} expected ${implementations}, found ${actual}.")
                }
                implementations.each { implementation ->
                    def sourcePath = implementation.replace('.', '/') + '.java'
                    def source = layout.projectDirectory.file("${moduleName}/src/main/java/${sourcePath}").asFile
                    if (!source.isFile()) {
                        throw new GradleException("${moduleName} descriptor ${serviceName} references missing ${implementation}.")
                    }
                }
            }
        }

        def descriptorFiles = fileTree('.') {
            include 'athena-vendor-*/src/main/resources/META-INF/services/*'
        }.files
        descriptorFiles.each { descriptor ->
            def moduleName = descriptor.path.split('/').find { it.startsWith('athena-vendor-') }
            def serviceName = descriptor.name
            if (!expectedDescriptors.containsKey(moduleName)
                    || !expectedDescriptors[moduleName].containsKey(serviceName)) {
                throw new GradleException("Unexpected vendor ServiceLoader descriptor ${descriptor}. Add it to verifyVendorServiceDescriptors.")
            }
        }
    }
}

tasks.register('verifyArchitectureBoundaries') {
    description = 'Checks that core artifacts stay free of vendor adapter dependencies and imports.'
    group = 'verification'

    doLast {
        def defaultArtifacts = rootProject.ext.athenaDefaultArtifacts as Set
        def vendorArtifacts = subprojects.collect { it.name }.findAll { it.startsWith('athena-vendor-') } as Set
        def publishedArtifacts = rootProject.ext.athenaPublishedArtifacts as Set
        def mainDependencyConfigurations = ['api', 'implementation', 'compileOnly', 'runtimeOnly']

        subprojects.each { project ->
            if (project.name == 'example-project') {
                return
            }

            mainDependencyConfigurations.each { configurationName ->
                def configuration = project.configurations.findByName(configurationName)
                if (configuration == null) {
                    return
                }
                configuration.dependencies.withType(ProjectDependency).each { dependency ->
                    def dependencyName = dependency.dependencyProject.name
                    if (vendorArtifacts.contains(dependencyName) && !project.name.startsWith('athena-vendor-')) {
                        throw new GradleException("${project.path} ${configurationName} depends on vendor adapter ${dependencyName}.")
                    }
                    if (project.name.startsWith('athena-vendor-') && vendorArtifacts.contains(dependencyName)) {
                        throw new GradleException("${project.path} ${configurationName} must not depend on another vendor adapter ${dependencyName}.")
                    }
                    if (defaultArtifacts.contains(project.name) && !defaultArtifacts.contains(dependencyName)) {
                        throw new GradleException("Default artifact ${project.name} ${configurationName} depends on non-default artifact ${dependencyName}.")
                    }
                }
            }

            if (!project.name.startsWith('athena-vendor-') && publishedArtifacts.contains(project.name)) {
                def sourceDir = layout.projectDirectory.dir("${project.name}/src/main/java").asFile
                if (sourceDir.isDirectory()) {
                    def vendorImports = fileTree(sourceDir).matching { include '**/*.java' }.files.findAll { file ->
                        file.text.contains('import ca.frc6390.athena.vendor.')
                    }
                    if (!vendorImports.isEmpty()) {
                        throw new GradleException("${project.path} imports vendor adapter packages: "
                                + vendorImports.collect { it.path - rootDir.path - '/' }.sort().join(', '))
                    }
                }
            }
        }
    }
}

