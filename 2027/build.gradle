        [
                'Frozen legacy root with new replacement workspace',
                'Clean tiered artifact layout instead of one massive core',
                'Single human-facing Athena vendordep',
                'Vendor dependency isolation and conditional selection',
                'Student-facing Java syntax using `toSpec()`',
