}

tasks.register('verifyExampleMigrationMap') {
    description = 'Checks that every frozen legacy example is accounted for in the 2027 migration map.'
    group = 'verification'

    def legacyCatalog = layout.projectDirectory.file('../docs/coverage/examples-catalog.md')
    def legacyExamples = layout.projectDirectory.dir('../athena-examples/src/main/java')
    def migrationMap = layout.projectDirectory.file('docs/example-migration-map.md')

    inputs.file(legacyCatalog)
    inputs.dir(legacyExamples)
    inputs.file(migrationMap)

    doLast {
        def mapText = migrationMap.asFile.text
        def catalogExamples = legacyCatalog.asFile.readLines()
                .findAll { it.startsWith('- `') && it.endsWith('`') }
                .collect { it.substring(3, it.length() - 1).tokenize('/').last() }
        def sourceExamples = fileTree(legacyExamples.asFile) {
            include '**/*.java'
        }.files.collect { it.name }
        def missing = (catalogExamples + sourceExamples).unique().sort()
                .findAll { !mapText.contains("`" + it + "`") }
        if (!missing.isEmpty()) {
            throw new GradleException("Example migration map is missing legacy examples: ${missing.join(', ')}")
        }
    }
}

tasks.register('verifyModuleDocs') {
    description = 'Checks that each 2027 module has a README and focused tests.'
    group = 'verification'

    def moduleProjects = subprojects.findAll { it.name != 'example-project' }
    inputs.files(moduleProjects.collect { layout.projectDirectory.file("${it.name}/README.md") })
    inputs.files(moduleProjects.collect { layout.projectDirectory.dir("${it.name}/src/test/java") })

    doLast {
        def missingReadmes = moduleProjects.findAll { !layout.projectDirectory.file("${it.name}/README.md").asFile.isFile() }
                .collect { it.name }
        if (!missingReadmes.isEmpty()) {
            throw new GradleException("Modules missing README.md: ${missingReadmes.join(', ')}")
        }

        def readmesWithoutCurrentSlice = moduleProjects.findAll {
            !layout.projectDirectory.file("${it.name}/README.md").asFile.text.contains('## Current Slice')
        }.collect { it.name }
        if (!readmesWithoutCurrentSlice.isEmpty()) {
            throw new GradleException("Module READMEs missing Current Slice section: ${readmesWithoutCurrentSlice.join(', ')}")
        }

        def modulesWithoutTests = moduleProjects.findAll {
            def testDir = layout.projectDirectory.dir("${it.name}/src/test/java").asFile
            !testDir.isDirectory() || fileTree(testDir).matching { include '**/*Test.java' }.isEmpty()
        }.collect { it.name }
        if (!modulesWithoutTests.isEmpty()) {
            throw new GradleException("Modules missing focused tests: ${modulesWithoutTests.join(', ')}")
        }
    }
}

tasks.register('verifyReadmeModuleCatalog') {
    description = 'Checks that the root README module catalog matches Gradle projects.'
    group = 'verification'

    def rootReadme = layout.projectDirectory.file('README.md')
    inputs.file(rootReadme)
    inputs.files(subprojects.collect { layout.projectDirectory.file("${it.name}/README.md") })

    doLast {
        def readmeText = rootReadme.asFile.text
        def actualModules = subprojects.collect { it.name } as Set
        def listedModules = [] as Set
        readmeText.readLines().each { line ->
            def matcher = line =~ /^- `(athena-[^`]+|example-project)`:/
            if (matcher.find()) {
                listedModules.add(matcher.group(1))
            }
        }

        def missing = actualModules - listedModules
        if (!missing.isEmpty()) {
            throw new GradleException("Root README module catalog is missing modules: ${missing.sort().join(', ')}")
        }
        def unknown = listedModules - actualModules
        if (!unknown.isEmpty()) {
            throw new GradleException("Root README module catalog lists unknown modules: ${unknown.sort().join(', ')}")
        }

        subprojects.each { project ->
            def readme = layout.projectDirectory.file("${project.name}/README.md").asFile
            if (!readme.isFile()) {
                throw new GradleException("${project.path} is missing README.md.")
            }
            def firstLine = readme.readLines().find { !it.trim().isEmpty() }
            if (project.name == 'example-project') {
                if (firstLine != '# Athena 2027 Example Project') {
                    throw new GradleException("${project.path} README must start with '# Athena 2027 Example Project', found '${firstLine}'.")
                }
                return
            }
            if (firstLine != "# ${project.name}") {
                throw new GradleException("${project.path} README must start with '# ${project.name}', found '${firstLine}'.")
            }
        }
    }
}

tasks.register('verifyReadmeDependencies') {
    description = 'Checks that module README dependency sections mention their Gradle project dependencies.'
    group = 'verification'

    inputs.files(subprojects.collect { layout.projectDirectory.file("${it.name}/README.md") })

    doLast {
        subprojects.findAll { it.name != 'example-project' }.each { project ->
            def readme = layout.projectDirectory.file("${project.name}/README.md").asFile
            def text = readme.text
            if (!text.contains('## Dependencies')) {
                throw new GradleException("${project.path} README is missing Dependencies section.")
            }

            def productionDeps = ['api', 'implementation']
                    .collectMany { configurationName ->
                        def configuration = project.configurations.findByName(configurationName)
                        configuration == null ? [] : configuration.dependencies.withType(ProjectDependency).collect {
                            it.dependencyProject.name
                        }
                    }
                    .unique()
                    .sort()
            def testDeps = ['testImplementation']
                    .collectMany { configurationName ->
                        def configuration = project.configurations.findByName(configurationName)
                        configuration == null ? [] : configuration.dependencies.withType(ProjectDependency).collect {
                            it.dependencyProject.name
                        }
                    }
                    .unique()
                    .sort()

            if (productionDeps.isEmpty() && !text.contains('- Production: none.')) {
                throw new GradleException("${project.path} README must document no production project dependencies.")
            }
            productionDeps.each { dependency ->
                if (!text.contains("`" + dependency + "`")) {
                    throw new GradleException("${project.path} README Dependencies section is missing production dependency ${dependency}.")
                }
            }

            if (testDeps.isEmpty() && !text.contains('- Test-only: none.')) {
                throw new GradleException("${project.path} README must document no test-only project dependencies.")
            }
            testDeps.each { dependency ->
                if (!text.contains("`" + dependency + "`")) {
                    throw new GradleException("${project.path} README Dependencies section is missing test-only dependency ${dependency}.")
                }
            }
        }
    }
}

tasks.register('verifyPublicApiJavadocs') {
    description = 'Checks that every public top-level Java API type has class-level Javadocs.'
    group = 'verification'

    def sourceRoots = subprojects.collect { layout.projectDirectory.dir("${it.name}/src/main/java") }
    sourceRoots.each { inputs.dir(it) }

    doLast {
        def undocumented = []
        sourceRoots.each { sourceRoot ->
            def rootFile = sourceRoot.asFile
            if (!rootFile.isDirectory()) {
                return
            }
            fileTree(rootFile).matching { include '**/*.java' }.files.each { source ->
                def lines = source.readLines()
                for (int index = 0; index < lines.size(); index++) {
                    def line = lines[index]
                    if (!(line ==~ /^\s*public\s+(final\s+|abstract\s+|sealed\s+|non-sealed\s+)?(class|interface|enum|record)\s+.*/)) {
                        continue
                    }
                    int cursor = index - 1
                    while (cursor >= 0 && lines[cursor].trim().isEmpty()) {
                        cursor--
                    }
                    while (cursor >= 0 && lines[cursor].trim().startsWith('@')) {
                        cursor--
                        while (cursor >= 0 && lines[cursor].trim().isEmpty()) {
                            cursor--
                        }
                    }
                    if (cursor < 0 || lines[cursor].trim() != '*/') {
                        undocumented.add("${source.path - rootDir.path - '/'}:${index + 1}")
                        continue
                    }
                    boolean hasStart = false
                    while (cursor >= 0 && !lines[cursor].trim().startsWith('package ')) {
                        if (lines[cursor].trim().startsWith('/**')) {
                            hasStart = true
                            break
                        }
                        cursor--
                    }
                    if (!hasStart) {
                        undocumented.add("${source.path - rootDir.path - '/'}:${index + 1}")
                    }
                }
            }
        }
        if (!undocumented.isEmpty()) {
            throw new GradleException("Public API types missing class-level Javadocs: ${undocumented.sort().join(', ')}")
        }
    }
}

