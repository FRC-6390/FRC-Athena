name: Dashboard release

# Builds the Athena Dashboard desktop app (Tauri 2, athena-arcp/host-dashboard) for Linux, Windows and macOS.
#
# Triggers:
#   - workflow_dispatch: builds every matrix entry and uploads the bundles as workflow artifacts. No release.
#   - push of a tag dashboard-v*: builds the same matrix and attaches the bundles to a DRAFT GitHub release
#     for that tag. Publish the draft by hand after checking it.
#
# Artifacts: dashboard-<matrix name> (one per matrix entry) holds the bundles for that platform.
# Only the default GITHUB_TOKEN is used. Code signing is NOT configured (see the TODO blocks below).

on:
  workflow_dispatch:
  push:
    tags:
      - 'dashboard-v*'

permissions:
  contents: write

concurrency:
  group: dashboard-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: athena-arcp/host-dashboard
  # Pinned versions. Update deliberately.
  TAURI_ACTION: tauri-apps/tauri-action@action-v1.0.0
  BUN_VERSION: 1.2.9

jobs:
  build:
    name: "Build - ${{ matrix.name }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            args: '--bundles deb,appimage'
          - name: windows-x86_64
            os: windows-latest
            args: '--bundles nsis,msi'
          - name: macos-aarch64
            os: macos-14
            args: '--target aarch64-apple-darwin --bundles dmg'
          - name: macos-x86_64
            os: macos-13
            args: '--target x86_64-apple-darwin --bundles dmg'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libfuse2 \
            file \
            build-essential \
            curl \
            wget

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ env.PROJECT_DIR }}/src-tauri
          key: dashboard-${{ matrix.name }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # TODO(signing, Windows): code signing is not configured. To sign the NSIS/MSI bundles, add a
      #   certificate (base64 PFX) as a protected secret and set certificateThumbprint, digestAlgorithm
      #   and timestampUrl under bundle.windows in src-tauri/tauri.conf.json, or use signCommand.
      #   env:
      #     WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      #     WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # TODO(signing, macOS): Developer ID signing and notarization are not configured. Set these
      #   secrets/variables on the job when the Apple account is available (tauri-action reads them):
      #   env:
      #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build bundles and draft release
        uses: tauri-apps/tauri-action@action-v1.0.0
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          # Runs the package.json "tauri" script (scripts/tauri-launch.mjs) so the same CLI resolution is used
          # locally and in CI. tauri-action appends "build" and then the args.
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          # Only tag builds create or update a release. Without tagName, tauri-action only builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/dashboard-v') && github.ref_name || '' }}
          releaseName: 'Athena Dashboard ${{ github.ref_name }}'
          releaseBody: 'Desktop builds of the Athena Dashboard. Draft: check the bundles before publishing.'
          releaseDraft: true
          prerelease: false
          # No updater is configured, so no updater manifest or signatures are published.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'dashboard-${{ matrix.name }}'
