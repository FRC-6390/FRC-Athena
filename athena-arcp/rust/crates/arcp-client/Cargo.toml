[package]
name = "arcp-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "arcp_client"
path = "src/lib.rs"

[[bin]]
name = "arcp-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "arcp-ws-bridge"
path = "src/bin/ws_bridge.rs"

[dependencies]
arcp-core = { path = "../arcp-core" }
base64 = "0.22"
serde_json = "1"
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }

[dev-dependencies]
arcp-server = { path = "../arcp-server" }
