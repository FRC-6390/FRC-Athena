subprojects {
    group = rootProject.findProperty('athenaGroup')
    version = rootProject.findProperty('athenaVersion')

    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter-api:${rootProject.findProperty('junitVersion')}"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${rootProject.findProperty('junitVersion')}"
    }

    test {
        useJUnitPlatform()
    }

    publishing {
        repositories {
            maven {
                name = 'AthenaStaging'
                url = rootProject.layout.buildDirectory.dir('staging-repo')
            }
        }

        publications {
            mavenJava(MavenPublication) {
                from components.java

                pom {
                    name = project.name
                    description = "Athena root module ${project.name}"
                    url = 'https://github.com/FRC-6390/FRC-Athena'
                    licenses {
                        license {
                            name = 'MIT'
                            url = 'https://opensource.org/license/mit/'
                        }
                    }
                    developers {
                        developer {
                            id = 'frc6390'
                            name = 'FRC 6390'
                        }
                    }
                    scm {
                        url = 'https://github.com/FRC-6390/FRC-Athena'
                    }
                }
            }
        }
    }
}

