        wpilibTestNatives "edu.wpi.first.wpiutil:wpiutil-cpp:${rootProject.findProperty('wpilibVersion')}:windowsx86-64@zip"
        wpilibTestNatives "edu.wpi.first.wpimath:wpimath-cpp:${rootProject.findProperty('wpilibVersion')}:windowsx86-64@zip"
    }

    tasks.register('extractWpilibTestNatives', Sync) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from { configurations.wpilibTestNatives.collect { zipTree(it) } }
        into layout.buildDirectory.dir('wpilib-test-natives')
    }

    test {
        dependsOn tasks.named('extractWpilibTestNatives')
        systemProperty(
                'java.library.path',
                layout.buildDirectory.dir('wpilib-test-natives/windows/x86-64/shared').get().asFile.absolutePath)
    }
}

