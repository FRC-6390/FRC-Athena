subprojects {
    group = rootProject.findProperty('athenaGroup')
    version = rootProject.findProperty('athenaVersion')

    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter-api:${rootProject.findProperty('junitVersion')}"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${rootProject.findProperty('junitVersion')}"
    }

    test {
        useJUnitPlatform()
    }

    publishing {
        repositories {
            maven {
                name = 'AthenaStaging'
                url = rootProject.layout.buildDirectory.dir('staging-repo')
            }
        }

        publications {
            mavenJava(MavenPublication) {
                from components.java

                pom {
                    name = project.name
                    description = "Athena root module ${project.name}"
                    url = 'https://github.com/FRC-6390/FRC-Athena'
                    licenses {
                        license {
                            name = 'MIT'
                            url = 'https://opensource.org/license/mit/'
                        }
                    }
                    developers {
                        developer {
                            id = 'frc6390'
                            name = 'FRC 6390'
                        }
                    }
                    scm {
                        url = 'https://github.com/FRC-6390/FRC-Athena'
                    }
                }
            }
        }
    }
}

def localWpilibYear = rootProject.findProperty('athenaFrcYear')?.toString() ?: '2027'
def defaultLocalWpilibHome = {
    String osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    if (osName.contains('win')) {
        return file("C:/Users/Public/wpilib/${localWpilibYear}")
    }
    if (osName.contains('mac')) {
        return file("/Users/Shared/wpilib/${localWpilibYear}")
    }
    return file("${System.getProperty('user.home')}/wpilib/${localWpilibYear}")
}()
def localWpilibHome = rootProject.findProperty('athenaWpilibHome')
        ? file(rootProject.findProperty('athenaWpilibHome').toString())
        : defaultLocalWpilibHome
def localWpilibMavenDir = file("${localWpilibHome}/maven")
def localWpilibVendordepsDir = file("${localWpilibHome}/vendordeps")
def localMavenAthenaGroupDir = file("${System.getProperty('user.home')}/.m2/repository/${rootProject.findProperty('athenaGroup').toString().replace('.', '/')}")
def localWpilibAthenaGroupDir = file("${localWpilibMavenDir}/${rootProject.findProperty('athenaGroup').toString().replace('.', '/')}")
def athenaVendordepFile = file("${rootDir}/vendordeps/FRC6390-Athena.json")

tasks.register('installLocalWpilibVendordep') {
    group = 'Publishing'
    description = 'Installs the Athena vendordep JSON into the local WPILib vendordeps folder.'
    inputs.file athenaVendordepFile
    inputs.property('athenaVersion', rootProject.findProperty('athenaVersion'))
    inputs.property('athenaFrcYear', localWpilibYear)
    inputs.property('athenaMavenUrl', rootProject.findProperty('athenaMavenUrl'))
    outputs.file file("${localWpilibVendordepsDir}/${athenaVendordepFile.name}")

    doLast {
        localWpilibVendordepsDir.mkdirs()
        def json = new groovy.json.JsonSlurper().parse(athenaVendordepFile)
        json.version = rootProject.findProperty('athenaVersion').toString()
        json.frcYear = localWpilibYear
        json.mavenUrls = [
                localWpilibMavenDir.toURI().toString(),
                rootProject.findProperty('athenaMavenUrl').toString()
        ]
        def outputFile = file("${localWpilibVendordepsDir}/${athenaVendordepFile.name}")
        outputFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + System.lineSeparator()
        logger.lifecycle("Installed Athena vendordep to ${outputFile}")
    }
}

tasks.register('copyMavenLocalToWpilib', Sync) {
    group = 'Publishing'
    description = 'Copies Athena artifacts from Maven Local into the local WPILib Maven folder.'
    dependsOn subprojects.collect { it.tasks.named('publishToMavenLocal') }
    from localMavenAthenaGroupDir
    into localWpilibAthenaGroupDir

    doFirst {
        if (!localMavenAthenaGroupDir.exists()) {
            throw new GradleException("Athena artifacts were not found in Maven Local at ${localMavenAthenaGroupDir}.")
        }
        localWpilibMavenDir.mkdirs()
        logger.lifecycle("Copying Athena Maven artifacts to ${localWpilibAthenaGroupDir}")
    }
}

tasks.register('publishToLocalWpilib') {
    group = 'Publishing'
    description = 'Publishes Athena locally and installs artifacts plus vendordep JSON into the local WPILib folder.'
    dependsOn tasks.named('copyMavenLocalToWpilib')
    dependsOn tasks.named('installLocalWpilibVendordep')
}

def exampleProjects = ['blank', 'tank-drive', 'swerve-drive']
def exampleGradleCommand = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win')
        ? 'gradlew.bat'
        : './gradlew'

exampleProjects.each { exampleName ->
    tasks.register("compile${exampleName.split('-').collect { it.capitalize() }.join('')}Example", Exec) {
        group = 'Verification'
        description = "Compiles the ${exampleName} example project against locally published Athena artifacts."
        dependsOn subprojects.collect { it.tasks.named('publishToMavenLocal') }
        workingDir = file("${rootDir}/example-projects/${exampleName}")
        commandLine exampleGradleCommand, 'compileJava'
    }
}

tasks.register('compileExamples') {
    group = 'Verification'
    description = 'Compiles all standalone example robot projects against locally published Athena artifacts.'
    dependsOn exampleProjects.collect { exampleName ->
        tasks.named("compile${exampleName.split('-').collect { it.capitalize() }.join('')}Example")
    }
}

