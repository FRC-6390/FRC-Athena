project(':athena-plugin') {
    apply plugin: 'java-gradle-plugin'

    gradlePlugin {
        plugins {
            athena {
                id = 'ca.frc6390.athena'
                implementationClass = 'ca.frc6390.athena.plugin.gradle.AthenaGradlePlugin'
                displayName = 'FRC 6390 Athena'
                description = 'Selects Athena V3 feature and vendor artifacts.'
            }
        }
    }

    dependencies {
        api project(':athena-api')
    }

    afterEvaluate {
        publishing.publications.remove(publishing.publications.mavenJava)
        tasks.matching { it.name.startsWith('publishMavenJavaPublicationTo') }.configureEach {
            enabled = false
        }
    }
}

